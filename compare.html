<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビルド比較 - 巡遊者の計算ノート</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="common.css">
<style>
  :root { --side-a: #6B7280; --side-b: #0A8F96; --df-bg: #FFF4D6; --df-line: #E9C46A; --up: #05626A; --down: #B3364F; }
  :root[data-theme="dark"] { --side-a: #A9AECF; --side-b: #3CCFD5; --df-bg: #3A3214; --df-line: #8A7330; --up: #5FE0C0; --down: #FF7F96; }
  body { padding-bottom: 40px; }
  /* 上の帯と見出し（計算ノートと同じ） */
  .notes-bar { background: var(--ink); font-size: 12px; line-height: 1; }
  .notes-bar .wrap { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .notes-bar a { flex: none; display: block; padding: 8px 10px; color: #C5CAE3; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .notes-bar a:hover { color: #fff; }
  .notes-bar a[aria-current] { color: #fff; box-shadow: inset 0 -2px var(--accent); }
  .notes-bar .nb-home { padding-left: 0; margin-right: 8px; font-family: var(--font-en); font-size: 15px; font-weight: 400; letter-spacing: .08em; color: #fff; }
  /* スマホでは、帯は「TREKKERS' NOTES（LPへ）」とライト・ダークの切り替えだけ（ほかのツールへはLPから。計算ノート・素質ノートで同じ） */
  @media (max-width: 640px) { .notes-bar a:not(.nb-home) { display: none; } }
  [data-theme="dark"] .notes-bar a:not([aria-current]):not(.nb-home):not(:hover) { color: #DADDF0; }
  .site-header .wrap { padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
  .logo-star { width: 26px; height: 26px; fill: var(--accent); flex: none; }
  .logo-h1 { margin: 0; font-size: inherit; font-weight: inherit; display: inline-flex; align-items: center; gap: 10px; }
  .wrap-c { max-width: 1680px; margin: 0 auto; padding: 0 16px; }
  .panel { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 14px; margin: 12px 0; }
  .panel > h2 { margin: 0 0 8px; font-size: 15px; font-weight: 900; color: var(--indigo); }
  .muted { color: var(--muted); }
  .ng { color: var(--danger); }
  /* 呼び出し・保存 */
  #ctl { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  #ctl .pick { display: flex; gap: 8px; align-items: center; }
  #ctl select, #ctl input[type=text] { min-height: 36px; border-radius: 10px; border: 2px solid var(--border); padding: 0 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; max-width: 280px; }
  #ctl .btn-add { min-height: 36px; padding: 0 14px; }
  #ctl .btn-add.pri { background: var(--indigo-fill); color: #fff; border-color: var(--indigo-fill); }
  #ctl .btn-add:disabled { opacity: .45; cursor: not-allowed; }
  #ctl .opts { gap: 14px; }
  #ctl .msg { flex-basis: 100%; font-size: 13px; font-weight: 700; color: var(--link); }
  #ctl .msg.ng { color: var(--danger); }
  .side { font-weight: 900; font-size: 13px; }
  .side-a { color: var(--side-a); }
  .side-b { color: var(--side-b); }
  .ck { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 400; margin: 0; cursor: pointer; }
  .unitbar { display: inline-flex; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
  .unitbar button { min-height: 28px; padding: 0 10px; border: 0; background: var(--surface); color: var(--indigo); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .unitbar button + button { border-left: 2px solid var(--border); }
  .unitbar button.on { background: var(--indigo-fill); color: #fff; }
  /* 固定の帯（上に固定） */
  #band { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 2px solid var(--border); box-shadow: 0 4px 14px rgba(30,34,80,.10); }
  [data-theme="dark"] #band { background: rgba(27,30,56,.97); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .band-in { max-width: 1680px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 16px; align-items: center; min-height: 64px; }
  .tot { display: flex; flex-direction: column; min-width: 0; }
  .tot .nm { font-size: 12px; font-weight: 900; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tot b { font-size: 20px; font-weight: 900; color: var(--indigo); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .arrow { color: var(--muted); font-weight: 900; }
  .dd { display: flex; flex-direction: column; align-items: center; padding: 2px 14px; border-radius: 12px; background: var(--surface-soft); }
  .dd span { font-size: 11px; color: var(--muted); font-weight: 700; }
  .dd b { font-size: 24px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .dd small { font-size: 11px; color: var(--muted); }
  .up, .dd.up b { color: var(--up); }
  .down, .dd.down b { color: var(--down); }
  em.up, em.down { font-style: normal; font-weight: 700; }
  .pms { display: grid; grid-template-columns: 1fr; gap: 0; font-size: 12px; min-width: 300px; }
  .pm { display: grid; grid-template-columns: 150px 1fr 58px; gap: 6px; align-items: baseline; }
  .pm span { color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pm b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pm em { font-style: normal; font-weight: 700; text-align: right; }
  .cds { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 14px; font-size: 12px; align-content: center; }
  .cds-h { grid-column: 1 / -1; font-size: 11px; color: var(--muted); font-weight: 700; }
  .cd { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; gap: 6px; align-items: baseline; }
  .cd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cd b { font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .cd em { font-style: normal; font-weight: 900; text-align: right; color: var(--indigo); }
  /* 比較の表（左がビフォア、右がアフター） */
  table.cmp { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  table.cmp col.c1 { width: 300px; }
  table.cmp col.c4 { width: 110px; }
  table.cmp thead th { position: sticky; top: var(--band-h, 64px); z-index: 5; background: var(--surface); text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--border-strong); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.cmp td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow-wrap: anywhere; }
  table.cmp td.lb { color: var(--muted); font-weight: 700; }
  table.cmp td.va { color: var(--text); }
  table.cmp td.vb { color: var(--text); }
  table.cmp td.vd { text-align: right; font-weight: 900; color: var(--indigo); font-variant-numeric: tabular-nums; }
  table.cmp td .muted { font-size: 12px; margin-left: 4px; }
  table.cmp tr.sec th { text-align: left; padding: 10px 8px 6px; font-size: 15px; font-weight: 900; color: var(--indigo); border-bottom: 3px solid var(--elc, var(--border-strong)); }
  table.cmp tr.sub th { text-align: left; padding: 8px 8px 2px; font-size: 12px; font-weight: 900; color: var(--link); }
  table.cmp tr.df td { background: var(--df-bg); }
  table.cmp tr.df td.lb { box-shadow: inset 4px 0 0 var(--df-line); color: var(--text); }
  table.cmp tr.calc td.va, table.cmp tr.calc td.vb { font-variant-numeric: tabular-nums; }
  table.cmp tr.strong td { font-weight: 900; font-size: 14px; }
  table.cmp tr.warn td.vb { color: var(--danger); font-weight: 700; }
  table.cmp input[type=number] { text-align: left; width: 84px; min-height: 28px; padding: 0 6px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
  table.cmp select { width: auto; min-height: 28px; max-width: 100%; padding: 0 4px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; margin-right: 4px; }
  table.cmp td.vb select + select { margin-top: 2px; }
  table.ctab td.va .muted, table.ctab td.vb .muted { font-size: 11px; }
  .lead-c { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<nav class="notes-bar" aria-label="巡遊者ノートのツール"><div class="wrap">
  <a class="nb-home" href="https://stella-tool.com/" title="巡遊者ノート（トップ）">TREKKERS’ NOTES</a>
  <a href="sim.html" aria-current="true">計算ノート</a>
  <a href="https://preset.stella-tool.com/">素質ノート</a>
</div></nav>
<header class="site-header"><div class="wrap">
  <svg class="logo-star" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 1.5C12.8 8 16 11.2 22.5 12 16 12.8 12.8 16 12 22.5 11.2 16 8 12.8 1.5 12 8 11.2 11.2 8 12 1.5z"></path></svg>
  <h1 class="logo-h1"><span class="logo-ja">ビルド比較</span><span class="logo-en">COMPARE BUILDS</span></h1>
  <span style="flex:1"></span>
  <a class="btn-add" href="sim.html" style="display:inline-flex;align-items:center;text-decoration:none;min-height:36px">← 計算ノートに戻る</a>
</div></header>
<div class="wrap-c">
  <p class="lead-c">このブラウザに保存したビルドを左右に呼び出して比べます。左（ビフォア）は保存したまま、右（アフター）はこの画面で変えられます（巡遊者とロスレコの付け替えはできません）。変えた右は、名前を付けて保存できます。</p>
  <div class="panel" id="ctl"></div>
</div>
<div id="band"></div>
<div class="wrap-c" id="rows"></div>

<script src="data.js"></script>
<script src="data_sup.js"></script>

<script src="data/sim_chars_auto.js"></script>
<script src="sim_data.js"></script>
<script src="data/spec_user.js"></script>
<script src="data/spec_draft.js"></script>
<script src="data/core_lv.js"></script>
<script src="sim_pots.js"></script>

</body>
</html>
