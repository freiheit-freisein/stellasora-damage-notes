<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巡遊者ダメージ計算</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<style>
  body { padding-bottom: 20px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 560px; gap: 14px; padding: 12px; align-items: start; }
  .panel { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .panel > h2 { margin: 0 0 8px; font-size: 15px; font-weight: 900; color: var(--indigo); display: flex; gap: 8px; align-items: baseline; }
  .panel > h2 .en { font-family: var(--font-en); font-weight: 400; font-size: 13px; letter-spacing: .14em; color: var(--link); }
  /* 倍率タイル */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile { border: 2px solid var(--border-strong); border-radius: 14px; padding: 8px 10px; background: var(--surface-soft); text-align: center; min-height: 66px; }
  .tile span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
  .tile b { display: block; font-size: 20px; font-weight: 900; color: var(--indigo); line-height: 1.3; }
  .tile small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .tile.pink { background: var(--pink-soft); border-color: var(--pink-line); cursor: pointer; }
  .tile.pink:hover { background: #f8d3db; }
  .tile.sel { outline: 3px solid var(--accent); }
  /* 選択ボタン */
  .sel-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .sbtn { min-height: 38px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--pink-line); background: var(--pink-soft); font-weight: 700; color: var(--text); cursor: pointer; }
  .sbtn:hover { background: #f8d3db; }
  .sbtn.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .obtn { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 2px solid #E3B27A; background: #FDEBD3; font-weight: 700; cursor: pointer; width: 100%; }
  .obtn:hover { background: #fbddb4; }
  .obtn.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  /* 表示エリア */
  .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .chcol { border: 2px solid var(--border); border-radius: 14px; padding: 10px; }
  .chcol h3 { margin: 0 0 6px; font-size: 15px; color: var(--indigo); display: flex; gap: 6px; align-items: center; }
  .fld { display: grid; grid-template-columns: 112px 1fr; gap: 4px 8px; align-items: center; margin: 3px 0; font-size: 13px; }
  .fld label { margin: 0; font-size: 12px; }
  .fld input[type=number], .fld select { min-height: 32px; padding: 0 8px; border-radius: 8px; }
  .card-t { width: 100%; font-size: 12px; margin-top: 0; table-layout: fixed; }
  .card-t td:nth-child(1) { width: 112px; }
  .card-t td:nth-child(2) { width: 84px; }
  .box { border: 2px solid var(--border); border-radius: 12px; padding: 8px 10px; margin-top: 8px; background: var(--surface); }
  .card-t td, .card-t th { padding: 2px 6px; }
  .card-t td:first-child { color: var(--muted); font-weight: 700; }
  .wide { border: 2px solid var(--border); border-radius: 14px; padding: 12px; }
  .wide h3 { margin: 0 0 8px; font-size: 16px; color: var(--indigo); }
  .grid-in { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
  .pot { border: 2px solid var(--border); border-radius: 12px; padding: 8px 10px; font-size: 12px; background: var(--surface); }
  .pot.core { border-color: var(--pink-line); }
  .pot b { font-size: 13px; color: var(--indigo); }
  .pot .lv { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .pot .lv input[type=number] { width: 70px; min-height: 28px; }
  .tag-ok { font-size: 11px; background: var(--tag-bg); color: var(--tag-text); border-radius: 999px; padding: 0 8px; font-weight: 700; margin-left: 4px; }
  .tag-ng { font-size: 11px; background: var(--pink-soft); color: var(--text); border-radius: 999px; padding: 0 8px; font-weight: 700; margin-left: 4px; }
  /* 結果 */
  .res-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .res-row .tile { min-height: 74px; }
  .cmp { font-size: 12px; font-weight: 700; }
  .cmp.up { color: #05626A; } .cmp.down { color: var(--danger); }
  #drill table { font-size: 12px; }
  #drill th, #drill td { padding: 4px 6px; }
  .topbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px 0; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .emb-row { display: grid; grid-template-columns: 1fr 100px; gap: 6px; margin: 3px 0; }
  .emb-row select { min-height: 32px; padding: 0 6px; border-radius: 8px; font-size: 12px; }
  .emb-card { border: 2px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .emb-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--indigo); }
  /* 結果表示エリアは、スクロールしても画面に付いてくる */
  #right { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; align-self: start; }
  /* 一覧から選ぶ形式（徽章・ロスレコ） */
  .emb-slot { margin: 4px 0; }
  .slotbtn { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--pink-line); background: var(--pink-soft); font-weight: 700; color: var(--text); cursor: pointer; text-align: left; }
  .slotbtn.on, .slotbtn:hover { background: #f8d3db; }
  .picker { border: 2px dashed var(--border-strong); border-radius: 12px; padding: 8px; margin: 6px 0 10px; background: var(--surface-soft); }
  .emb-line { display: grid; grid-template-columns: 80px 150px 230px 130px 200px; gap: 6px; align-items: center; margin: 5px 0; }
  .emb-line select { width: 100%; min-height: 34px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
  .emb-line .obtn { width: 100% !important; }
  .pgrid { display: grid; gap: 8px; margin: 4px 0 10px; }
  .phead { font-size: 14px; font-weight: 900; color: var(--indigo); margin: 10px 0 4px; }
  .pcat { margin-bottom: 6px; }
  .pcat-h { font-size: 12px; font-weight: 900; color: var(--indigo); margin: 4px 0 2px; }
  .sbtn small { font-weight: 400; margin-left: 2px; }
  @media (max-width: 1500px) { .app { grid-template-columns: minmax(0, 1fr) 480px; } .tiles { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <span class="logo-ja">巡遊者ダメージ計算</span><span class="logo-en">DAMAGE SIM</span>
  <span style="flex:1"></span>
  <a class="btn-add" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">ウィロー側の検証ページ</a>
  <a class="btn-add" href="lux.html" style="display:inline-flex;align-items:center;text-decoration:none">光チームの検証ページ</a>
</div></header>
<div class="topbar" id="topbar"></div>
<div class="app">
  <div id="left">
    <div class="panel"><h2><span class="en">MULTIPLIERS</span>倍率表示エリア（種類を問わない共通の倍率）<span class="muted" id="tilesFor"></span></h2><div class="tiles" id="tiles"></div></div>
    <div class="panel"><h2><span class="en">SELECT</span>選ぶと下のエリアが変わります</h2><div id="selectors"></div></div>
    <div class="panel"><h2><span class="en">DISPLAY</span>表示エリア</h2><div id="display"></div></div>
  </div>
  <div id="right">
    <div class="panel"><h2><span class="en">RESULT</span>結果表示エリア<span class="muted">（ピンクをクリックで内訳）</span><span style="flex:1"></span><span id="cmpbar" style="display:inline-flex;gap:6px;align-items:center"></span></h2><div id="result"></div></div>
    <div class="panel" id="drillPanel" style="display:none"><h2><span class="en">DETAIL</span><span id="drillTitle">内訳</span></h2><div id="drill"></div></div>
  </div>
</div>
<script src="data/trekkers.js"></script>
<script src="data.js"></script>
<script src="data_sup.js"></script>
<script src="record_level.js"></script>
<script src="calc.js"></script>
<script src="sim_data.js"></script>
<script src="data/spec_user.js"></script>
<script src="sim_pots.js"></script>
<script src="sim_lr.js"></script>
<script src="sim_engine.js"></script>
<script src="data/potential_ja.js"></script>
<script src="sim_share.js"></script>
<script src="sim_ui.js"></script>
</body>
</html>
