<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>巡遊者の計算ノート FOR STELLA SORA</title>
<meta name="description" content="ステラソラ（Stella Sora）の巡遊者のダメージを、素質・徽章・ロスレコ・音符まで入れて計算する非公式ツール。ビルドを短いURLで共有できます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="巡遊者の計算ノート">
<meta property="og:title" content="巡遊者の計算ノート FOR STELLA SORA">
<meta property="og:description" content="素質・徽章・ロスレコ・音符まで入れて、巡遊者のダメージを計算する非公式ツール">
<meta property="og:image" content="https://sim.stella-tool.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
<style>
  body { padding-bottom: 20px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 560px; gap: 14px; padding: 12px; align-items: start; }
  .panel { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .panel > h2 { margin: 0 0 8px; font-size: 15px; font-weight: 900; color: var(--indigo); display: flex; gap: 8px; align-items: baseline; }
  .unitbar { display: inline-flex; border: 2px solid var(--border); border-radius: 999px; overflow: hidden; align-self: center; }
  .unitbar button { min-height: 28px; padding: 0 10px; border: 0; background: #fff; color: var(--indigo); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .unitbar button + button { border-left: 2px solid var(--border); }
  .unitbar button.on { background: #4B5082; color: #fff; }
  .panel > h2 .en { font-family: var(--font-en); font-weight: 400; font-size: 13px; letter-spacing: .14em; color: var(--link); }
  /* 倍率タイル */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tile { border: 2px solid var(--border-strong); border-radius: 14px; padding: 8px 10px; background: var(--surface-soft); text-align: center; min-height: 66px; }
  .tile span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
  .tile b { display: block; font-size: 20px; font-weight: 900; color: var(--indigo); line-height: 1.3; }
  .tile small { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
  /* ダメージのタイルは、ほかのピンクより淡い色（枠も） */
  :root { --dmg-soft: #FDF1F4; --dmg-line: #EEC3CD; }
  .tile.pink { background: var(--dmg-soft); border-color: var(--dmg-line); cursor: pointer; }
  .tile.pink:hover { background: #FBE6EB; }
  .tile.sel { outline: 3px solid var(--accent); }
  /* 選択ボタン */
  .sel-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .sbtn { min-height: 38px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--pink-line); background: var(--pink-soft); font-weight: 700; color: var(--text); cursor: pointer; }
  .sbtn:hover { background: #f8d3db; }
  .sbtn.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .obtn { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 2px solid #E3B27A; background: #FDEBD3; font-weight: 700; cursor: pointer; width: 100%; }
  .obtn:hover { background: #fbddb4; }
  .obtn.on { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  /* 表示エリア */
  .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .chcol { border: 2px solid var(--border); border-radius: 14px; padding: 10px; }
  .chcol h3 { margin: 0 0 6px; font-size: 15px; color: var(--indigo); display: flex; gap: 6px; align-items: center; }
  .fld { display: grid; grid-template-columns: 112px 1fr; gap: 4px 8px; align-items: center; margin: 3px 0; font-size: 13px; }
  .fld label { margin: 0; font-size: 12px; }
  .fld input[type=number], .fld select { min-height: 32px; padding: 0 8px; border-radius: 8px; }
  .card-t { width: 100%; font-size: 12px; margin-top: 0; table-layout: fixed; }
  .card-t td:nth-child(1) { width: 112px; }
  .card-t td:nth-child(2) { width: 84px; }
  .box { border: 2px solid var(--border); border-radius: 12px; padding: 8px 10px; margin-top: 8px; background: var(--surface); }
  .card-t td, .card-t th { padding: 2px 6px; }
  .card-t td:first-child { color: var(--muted); font-weight: 700; }
  .wide { border: 2px solid var(--border); border-radius: 14px; padding: 12px; }
  .wide h3 { margin: 0 0 8px; font-size: 16px; color: var(--indigo); }
  .grid-in { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
  .pot { border: 2px solid var(--border); border-radius: 12px; padding: 8px 10px; font-size: 12px; background: var(--surface); }
  .pot.core { border-color: var(--pink-line); }
  .pot b { font-size: 13px; color: var(--indigo); }
  .pot .lv { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .pot .lv input[type=number] { width: 70px; min-height: 28px; }
  .tag-ok { font-size: 11px; background: var(--tag-bg); color: var(--tag-text); border-radius: 999px; padding: 0 8px; font-weight: 700; margin-left: 4px; }
  .tag-ng { font-size: 11px; background: var(--pink-soft); color: var(--text); border-radius: 999px; padding: 0 8px; font-weight: 700; margin-left: 4px; }
  /* 結果 */
  .res-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .res-row .tile { min-height: 74px; }
  .cmp { font-size: 12px; font-weight: 700; }
  .cmp.up { color: #05626A; } .cmp.down { color: var(--danger); }
  #drill table { font-size: 12px; }
  #drill th, #drill td { padding: 4px 6px; }
  .topbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px 0; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .emb-row { display: grid; grid-template-columns: 1fr 100px; gap: 6px; margin: 3px 0; }
  .emb-row select { min-height: 32px; padding: 0 6px; border-radius: 8px; font-size: 12px; }
  .emb-card { border: 2px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .emb-card h4 { margin: 0 0 4px; font-size: 13px; color: var(--indigo); }
  /* 結果表示エリアは、スクロールしても画面に付いてくる */
  #right { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; align-self: start; }
  /* 一覧から選ぶ形式（徽章・ロスレコ） */
  .emb-slot { margin: 4px 0; }
  .slotbtn { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--pink-line); background: var(--pink-soft); font-weight: 700; color: var(--text); cursor: pointer; text-align: left; }
  .slotbtn.on, .slotbtn:hover { background: #f8d3db; }
  .picker { border: 2px dashed var(--border-strong); border-radius: 12px; padding: 8px; margin: 6px 0 10px; background: var(--surface-soft); }
  .emb-line { display: grid; grid-template-columns: 80px 150px 230px 130px 200px; gap: 6px; align-items: center; margin: 5px 0; }
  .emb-line select { width: 100%; min-height: 34px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
  .emb-line .obtn { width: 100% !important; }
  /* 素質の画面: 巡遊者の切り替え・表示の切り替え・コア素質・通常素質 */
  .pz { display: block; }
  .pz-main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .pz-mems { display: flex; gap: 10px; flex-wrap: wrap; }
  .pz-mem { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; min-height: 60px; padding: 8px 18px; border-radius: 16px; font: inherit; color: var(--text); cursor: pointer; text-align: left; background: #fff; border: 2px solid var(--border); }
  .pz-mem.on { background: #E6F7F8; border-color: #0ABEC5; }
  .pz-role { font-size: 11px; font-weight: 900; color: var(--indigo); }
  .pz-sum { font-size: 11px; color: var(--muted); }
  .pz-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pz-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pz-pill { min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; background: #fff; color: var(--indigo); border: 2px solid var(--border); }
  .pz-pill.on { background: #4B5082; color: #fff; border-color: #4B5082; }
  .pz-h { margin: 0 0 10px; font-size: 17px; font-weight: 900; color: var(--indigo); }
  .pz-cnt { font-size: 13px; font-weight: 900; padding: 0 10px; border-radius: 999px; margin-left: 6px; background: #EEF0F8; color: #4B5082; }
  .pz-cnt.full { background: #4B5082; color: #fff; }
  .pz-cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .pz-ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }   /* コア素質と同じ幅 */
  .pz-sub { grid-column: 1 / -1; font-size: 13px; font-weight: 900; color: var(--muted); margin-top: 4px; }
  .pz-row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .pz-name { flex: 1; min-width: 0; font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .pz-grp { flex: none; font-size: 11px; color: var(--muted); }
  .pz-desc { display: block; width: 100%; box-sizing: border-box; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: #33386A; text-align: left; line-height: 1.6; }
  .pz-core { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #fff; border: 2px solid var(--border); }
  .pz-core.on { background: #FFF8E1; border-color: #E0AE2E; }
  .pz-core.on .pz-desc { border-top-color: #E8D9A8; }
  .pz-core.dis { opacity: .55; }
  .pz-ctog { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; padding: 0; border: 0; background: none; font: inherit; color: var(--text); cursor: pointer; text-align: left; }
  .pz-ctog:disabled { cursor: not-allowed; }
  .pz-sw { width: 44px; height: 26px; flex: none; border-radius: 999px; position: relative; background: var(--border); }
  .pz-sw span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .pz-sw.on { background: #4B5082; } .pz-sw.on span { left: 21px; }
  .pz-norm { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: #fff; border: 2px solid var(--border); }
  .pz-norm.on { border-color: #0ABEC5; }
  .pz-lvt { flex: none; font-size: 13px; font-weight: 900; color: var(--indigo); }   /* 名前の後ろの「Lv6（徽章+3）」 */
  .pz-lvt.off { color: var(--muted); font-weight: 700; }
  .pz-norm .pz-name { flex: 0 1 auto; }
  .pz-lvs { flex: 1; display: flex; gap: 4px; }
  .pz-lv { flex: 1; min-width: 0; height: 36px; border-radius: 8px; font-family: var(--font-en); font-size: 18px; cursor: pointer; background: #fff; color: #4B5082; border: 2px solid var(--border); padding: 0; }
  .pz-lv.on { background: #0ABEC5; color: #1E2250; border-color: #0ABEC5; }
  .pz-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .pz-ctl { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .pz-c { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; flex: none; }
  .pz-norm .pz-row { gap: 6px; }
  .pz-norm .pz-row > .tag-ng { flex: none; white-space: nowrap; margin-left: 0; }
  .pz-ctl input[type=number] { min-height: 28px; padding: 0 6px; border-radius: 6px; }
  @media (max-width: 900px) { .pz-ngrid, .pz-cgrid { grid-template-columns: minmax(0, 1fr); } }
  .pgrid { display: grid; gap: 8px; margin: 4px 0 10px; }
  .phead { font-size: 14px; font-weight: 900; color: var(--indigo); margin: 10px 0 4px; }
  .pcat { margin-bottom: 6px; }
  .pcat-h { font-size: 12px; font-weight: 900; color: var(--indigo); margin: 4px 0 2px; }
  .sbtn small { font-weight: 400; margin-left: 2px; }
  @media (max-width: 1500px) { .app { grid-template-columns: minmax(0, 1fr) 480px; } .tiles { grid-template-columns: repeat(3, 1fr); } }

  /* ---- 見た目は素質ノート（プリセット共有サイト）に合わせる: 方眼の背景・白いカード・2pxの薄い枠。面は少しだけ透かす ---- */
  .site-header { background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
  .site-header .wrap { padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
  .logo-star { width: 26px; height: 26px; fill: var(--accent); flex: none; }
  .topbar { display: flex; gap: 6px; align-items: center; padding: 0; flex-wrap: nowrap; font-size: 13px; }
  .topbar b { color: var(--indigo); }
  .topbar input[type=text], .topbar select { min-height: 34px; border: 2px solid var(--border); background: #fff; border-radius: 10px; padding: 0 10px; }
  .topbar .btn-add { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .topbar .btn-add.pri { background: var(--accent); border-color: var(--accent); color: var(--text); font-weight: 900; }
  .topbar .sep { width: 1px; height: 22px; background: var(--border-strong); margin: 0 6px; }
  .tb-b { display: contents; }
  .panel { background: rgba(255,255,255,.94); border: 2px solid var(--border); border-radius: 18px; box-shadow: 0 4px 16px rgba(75,80,130,.06); }
  .panel > h2 .en { font-size: 15px; }
  .tile, .chcol, .box, .pot, .emb-card { background: var(--surface-soft); border: 2px solid var(--border); }
  .wide { background: transparent; border: 0; padding: 0; }
  .chcol { background: #fff; }
  .tile.pink { background: var(--dmg-soft); border-color: var(--dmg-line); }
  .pot.core { background: #fff7f9; border-color: var(--pink); }
  .btn-add { background: #fff; border: 2px solid var(--border); }
  .btn-add:hover { border-color: var(--indigo); }
  select, input[type=number] { background: #fff; border: 2px solid var(--border); }
  /* タブ: 素質ノートのナビと同じく、英字の小見出し＋日本語 */
  .tabs { display: flex; gap: 4px; padding: 0 0 10px; margin: 0 0 12px; background: none; border: 0; border-radius: 0; border-bottom: 2px dotted var(--accent); position: static; overflow-x: auto; scrollbar-width: none; }
  .tab { flex: none; display: flex; flex-direction: column; align-items: center; line-height: 1.2; min-height: 44px; padding: 6px 16px; border-radius: 10px; border: 0; background: transparent; color: var(--indigo); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; justify-content: center; }
  .tab .te { font-family: var(--font-en); font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--muted); }
  .tab:hover { background: var(--surface-soft); }
  .tab[aria-selected="true"] { background: var(--indigo); color: #fff; }
  .tab[aria-selected="true"] .te { color: var(--border); }
  .subnav { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .subnav .tabs { border: 0; padding: 0; }
  .subnav .tab { min-height: 36px; }
  .betabar { margin: 10px 12px 0; padding: 8px 44px 8px 14px; border-radius: 14px; background: #FFF6DA; border: 2px solid var(--yellow); font-size: 13px; color: var(--text); position: relative; line-height: 1.6; }
  .betabar b { color: var(--indigo); margin-right: 4px; }
  .betabar .linkbtn { border: 0; background: none; padding: 0 2px; color: var(--link); font-weight: 900; text-decoration: underline; cursor: pointer; font-size: 13px; }
  .betabar .closebtn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
  .betabar .closebtn:hover { background: rgba(0,0,0,.06); }
  .beta { display: inline-flex; align-items: center; min-height: 22px; padding: 0 10px; border-radius: 999px; background: var(--pink-soft); border: 2px solid var(--pink-line); color: var(--text); font-size: 12px; font-weight: 900; cursor: help; }
  .dlg textarea { width: 100%; min-height: 140px; border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; resize: vertical; }
  .dlg .row select, .dlg .row input[type=text].wide { width: 100%; min-height: 40px; border: 2px solid var(--border); border-radius: 10px; padding: 0 10px; }
  .xbtn { background: #1E2250 !important; color: #fff !important; border-color: #1E2250 !important; font-weight: 900; }
  /* 共有・読み込みのポップアップ */
  .dlg { width: min(760px, calc(100vw - 24px)); border: 2px solid var(--border); border-radius: 18px; padding: 18px; color: var(--text); box-shadow: 0 16px 48px rgba(30,34,80,.25); }
  .dlg::backdrop { background: rgba(30,34,80,.35); }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; color: var(--indigo); display: flex; align-items: center; gap: 8px; }
  .dlg h2 .en { font-family: var(--font-en); font-weight: 400; font-size: 15px; letter-spacing: .14em; color: var(--link); }
  .dlg .row { margin: 12px 0 0; }
  .dlg .row > label { margin: 0 0 4px; font-size: 14px; }
  .dlg .line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; }
  .dlg .line input { min-height: 40px; border: 2px solid var(--border); border-radius: 10px; padding: 0 10px; font-family: monospace; font-size: 13px; width: 100%; }
  .dlg .line .btn-add { min-height: 40px; padding: 0 14px; }
  .dlg .msg { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 2px; }
  .dlg .msg.ng { color: var(--danger); } .dlg .msg.ok { color: var(--ok); }
  .dlg .foot { display: flex; justify-content: flex-end; margin-top: 14px; gap: 8px; flex-wrap: wrap; }
  .dlg .sub { border-top: 2px dotted var(--accent); margin-top: 14px; padding-top: 6px; }
  @media (max-width: 560px) { .dlg .line { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dlg .line input { grid-column: 1 / -1; } }
  /* スクロールは画面全体で1本（結果の列だけのスクロールはしない） */
  #right { position: static; max-height: none; overflow: visible; }
  /* スマホ用の部品（PCでは出さない） */
  .mbar, .mstrip, .m-only { display: none; }
  /* ステータスの表（画面・戦闘中・防衛戦直後） */
  .stt { width: 100%; font-size: 12px; table-layout: fixed; margin: 0; }
  .stt th, .stt td { padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stt th { font-size: 11px; text-align: right; }
  .stt th:first-child, .stt td:first-child { text-align: left; width: 34%; color: var(--muted); font-weight: 700; }
  .stt td.bt { background: rgba(10,190,197,.08); font-weight: 700; color: var(--indigo); }
  .stt th.bt { color: var(--link); }
  /* 素質カード: 見出し・説明・操作を上下にそろえる */
  .pot { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pot .ph { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .pot .ph b { margin-right: 2px; }
  .pot .ph select { width: auto; min-height: 28px; padding: 0 6px; }
  .pot .pd { color: var(--muted); font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pot .pc { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .pot .pc .lv { margin: 0; }
  .pot .tag-ok, .pot .tag-ng { margin-left: 0; }
  .pgrid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
  /* ロスレコの枠（徽章と同じ形） */
  .lr-line { display: grid; grid-template-columns: 52px 64px 60px minmax(160px, 1fr) 84px; gap: 6px; align-items: center; margin: 5px 0; }
  .lr-line select { width: 100%; min-height: 34px; padding: 0 6px; border-radius: 8px; font-size: 13px; }
  .lr-line .lab { font-size: 12px; font-weight: 700; color: var(--muted); }
  /* ビルド検証の表: 項目・上下・与ダメ寄与率 */
  .decG { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 10px; }   /* 狭いときは2列・1列に折り返す */
  .decT td { white-space: normal; }
  .decT th:first-child { width: auto; }
  .decT th:nth-child(2) { width: 176px; text-align: center; }
  .decT th:nth-child(3) { width: 84px; }
  .decT td.c { text-align: center; overflow: visible; }
  .decT td.v { text-align: right; }
  .decT .ind { padding-left: .5em; }   /* 徽章の枠の2行目（項目と値）は半角1つ分下げる */
  .decin { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .decin .obtn { width: 24px; min-height: 24px; padding: 0; font-size: 11px; border-radius: 6px; }
  .decin .obtn:disabled { opacity: .35; cursor: default; }
  .decin b { width: 48px; text-align: center; font-size: 12px; }
  .decin .muted { width: 54px; text-align: right; font-size: 11px; }   /* 今の値と比べる値の幅をそろえ、◀▶が縦に並ぶように */
  .decin b.up { color: #C0392B; }
  .lr-line .obtn { padding: 0 4px; white-space: nowrap; font-size: 13px; }
  .lr-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 0 24px; }   /* 狭いときはメインの下にサブ */
  .cnt-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .cnt-grid .fld { grid-template-columns: 210px 1fr; }
  /* 音符（ゲームと同じく、色と名前の下に数、その下に効果） */
  .notes-row { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
  .note-cell { text-align: center; padding: 8px 4px; border-radius: 14px; background: #fff; border: 2px solid var(--border); border-top: 4px solid var(--nc); }
  .note-ic { width: 30px; height: 30px; margin: 0 auto 2px; border-radius: 50%; background: var(--nc); color: #fff; font-weight: 900; line-height: 30px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.15); }
  .note-nm { font-size: 12px; font-weight: 900; color: var(--indigo); }
  .note-cell input[type=number] { width: 100%; text-align: center; min-height: 34px; font-weight: 900; font-size: 16px; padding: 0 4px; margin: 2px 0; }
  .note-fx { font-size: 11px; color: var(--muted); line-height: 1.35; min-height: 30px; }
  .note-fx b { font-size: 13px; color: var(--indigo); }
  .note-per { font-size: 10px; color: var(--muted); }
  /* 内訳の表: 1ヒットを2段で（種別/名前・倍率/回数・非会心/会心・期待値/会心率と会心ダメ） */
  #drill table { table-layout: fixed; width: 100%; font-size: 12px; }
  #drill th, #drill td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 6px; border-bottom: 0; }
  #drill th { font-size: 11px; line-height: 1.3; border-bottom: 1px solid var(--border); }
  #drill tr.d2 td { border-bottom: 1px solid var(--border); padding-bottom: 5px; }
  #drill tr.d1 td { padding-top: 5px; }
  #drill tr.d1 td:first-child { color: var(--muted); font-size: 11px; }
  #drill tr.d2 td:first-child { font-weight: 700; color: var(--indigo); }
  #drill td.ex { font-weight: 900; color: var(--indigo); }
  #drill tr.sum td { border-top: 2px solid var(--border-strong); }
  #drill .nb { display: inline-block; white-space: nowrap; }

  /* ---- スマホ（幅860px以下）: 下のタブで「入力・結果・内訳」を切り替え、上に結果の帯 ---- */
  @media (max-width: 860px) {
    body { padding-bottom: 76px; font-size: 14px; }

    .logo-ja { font-size: 17px; } .logo-en { display: none; }
    .topbar { flex-wrap: wrap; width: 100%; }
    .tb-b, .topbar .sep, .topbar #smsg:empty { display: none; }
    .app { grid-template-columns: minmax(0, 1fr); padding: 8px; gap: 8px; }
    .panel { padding: 10px; border-radius: 14px; margin-bottom: 8px; }
    .panel > h2 { flex-wrap: wrap; }
    body.m-in #right, body.m-res #left, body.m-drill #left, body.m-res #drillPanel, body.m-drill #right > .panel:first-child { display: none !important; }
    body.m-drill #drillPanel:not([style*="none"]) { display: block; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .tile b { font-size: 17px; }
    .cols3, .grid-in { grid-template-columns: minmax(0, 1fr) !important; }
    .cols3 > .m-hide { display: none; }
    .m-only { display: flex; }
    .mchar { gap: 6px; margin-bottom: 8px; }
    .mchar .tab { flex: 1; }
    .pgrid { grid-template-columns: minmax(0, 1fr) !important; }
    .pot .pd { -webkit-line-clamp: 2; }
    .emb-line { grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr); }
    .lr-cols { grid-template-columns: minmax(0, 1fr); }
    .cnt-grid .fld { grid-template-columns: 150px minmax(0, 1fr); }
    .lr-line { grid-template-columns: 52px 64px 54px minmax(0, 1fr) 72px; }
    .notes-row { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .fld { grid-template-columns: 100px minmax(0, 1fr); }
    .res-row { gap: 6px; margin-bottom: 6px; }
    .wide > table { display: block; overflow-x: auto; }
    #drill td, #drill th { white-space: normal; overflow: visible; font-size: 11px; }
    #drill tr.d2 td:first-child { word-break: break-all; }
    .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 2px solid var(--border); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 6px; }
    .mbar .tab { flex: 1; }
    .mstrip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; background: rgba(255,255,255,.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; scrollbar-width: none; }
    .mchip { flex: none; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; padding: 4px 10px; border-radius: 10px; border: 2px solid var(--dmg-line); background: var(--dmg-soft); font-size: 11px; color: var(--muted); cursor: pointer; }
    .mchip b { font-size: 14px; color: var(--indigo); }
    .mchip .up { color: var(--ok); } .mchip .down { color: var(--danger); }
  }
</style>
